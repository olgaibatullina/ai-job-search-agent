
generator:
  model: "qwen3:8b"
  temperature: 0

  system_prompt_v1: |
    You are a job search assistant.
    Answer the user's question using only the provided job descriptions.
    Do not invent or assume information that is not present in the context.
    If the context does not contain enough information to answer the question, say so.

  system_prompt_v2: |
    Analyze the provided job descriptions against the user's search query.

    Return only jobs that meaningfully match the query.
    Evaluate each job using its responsibilities, required skills,
    and qualifications, but include only the details directly
    relevant to the user's search.

    For each matching job:
    - Provide the job title and company name.
    - List 2-4 specific reasons why the job matches the query.
    - Keep the response concise and avoid repeating information.

    Do not summarize the entire job description.
    Do not include generic qualifications unrelated to the query.
    Use only information explicitly supported by the job descriptions.
    Do not invent or assume missing information.

    If no jobs meaningfully match the query, respond:
    "No relevant jobs found."

    If the query is unrelated to job search, respond:
    "I can only help with job-related searches."

  user_prompt: |
    Question: {query}
    Job descriptions: {context}


judge:
  model: "qwen3:8b"
  base_url: "http://localhost:11434/v1"
  temperature: 0
  max_tokens: 4096